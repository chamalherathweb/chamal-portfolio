<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chamal Herath | Web Designer & Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            line-height: 1.6;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #111827;
            padding: 15px 8%;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #60a5fa;
        }

        section {
            padding: 80px 8%;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;
            margin: auto;
            font-size: 18px;
        }

        .hero-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .hero-btn:hover {
            transform: scale(1.05);
        }

        .section-title {
            text-align: center;
            font-size: 35px;
            margin-bottom: 40px;
        }

        .about {
            max-width: 850px;
            margin: auto;
            text-align: center;
            font-size: 18px;
        }

        .skills,
        .services,
        .projects {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .project-card {
            overflow: hidden;
        }

        .project-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .project-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 20px;
        }

        .contact-container {
            max-width: 700px;
            margin: auto;
        }

        .contact-info {
            text-align: center;
            margin-bottom: 30px;
        }

        .contact-info p {
            margin: 8px 0;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #form-message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .social-links a {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 25px;
            background: #111827;
            color: white;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero h2 {
                font-size: 23px;
            }

            .skills,
            .services,
            .projects {
                grid-template-columns: 1fr;
            }

            section {
                padding: 60px 6%;
            }
        }
    </style>
</head>

<header>

        <div class="logo">Chamal Herath</div>

        <ul>

            <li><a href="#skills">Skills</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

        <h2>Web Designer & Developer</h2>

        <p>
            I create modern, responsive and professional websites
            for businesses and personal brands.
        </p>

        <a href="#contact" class="hero-btn">Contact Me</a>
    </div>
</section>
